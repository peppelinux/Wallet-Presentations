<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>eIDAS references — search</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --border: #d0d7de; --text: #1a1a1a;
      --accent: #0366d6; --mark: #fff8c5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.5; color: var(--text); background: var(--bg);
      margin: 0; padding: 0 1.25rem 2rem; max-width: 960px;
    }
    header {
      padding: 1.25rem 0; border-bottom: 1px solid var(--border); margin-bottom: 1rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
  .nav { font-size: 0.9rem; }
  .nav a { color: var(--accent); }
    #search-form {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem 1.25rem; margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 0.5rem 0 0.2rem; }
    input[type="search"], input[type="text"], select {
      width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: 1rem;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    .actions { margin-top: 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button, .btn {
      padding: 0.45rem 1rem; border-radius: 6px; font-size: 0.95rem; cursor: pointer;
      border: 1px solid var(--border); background: #f6f8fa;
    }
    button[type="submit"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    #status { font-size: 0.9rem; color: #555; margin-bottom: 0.75rem; }
    #facet-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
    .tag-pick {
      font-size: 0.75rem; padding: 0.15rem 0.45rem; border-radius: 999px;
      background: #eef; border: 1px solid #ccd;
    }
    #sdo-chips {
      display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem;
    }
    .sdo-chip {
      font-size: 0.8rem; padding: 0.2rem 0.55rem; border-radius: 6px;
      border: 1px solid #0366d6; background: #e8f4fc; color: #024ea4;
      cursor: pointer;
    }
    .sdo-chip:hover { background: #cce5ff; }
    .sdo-chip.muted { opacity: 0.45; border-color: #ccc; background: #f0f0f0; color: #666; }
    .sdo-chip.active { background: #0366d6; color: #fff; border-color: #024ea4; }
    .result {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem 1.15rem; margin-bottom: 0.75rem;
    }
    .result h3 { margin: 0 0 0.35rem; font-size: 1.05rem; }
    .badges { margin: 0 0 0.5rem; }
    .badge {
      display: inline-block; font-size: 0.7rem; padding: 0.1rem 0.4rem;
      margin: 0 0.2rem 0.2rem 0; border-radius: 4px; background: #eee;
    }
    .badge.kind { background: #e8f4fc; }
    .badge.body { background: #e8fce8; }
    .badge.tag { background: #f5f0ff; }
    .snippet {
      margin: 0.5rem 0; padding: 0.6rem 0.75rem; background: #f9f9f9;
      border-left: 3px solid var(--accent); font-size: 0.9rem;
      white-space: pre-wrap; word-break: break-word;
    }
    .snippet mark { background: var(--mark); padding: 0 0.1em; }
    .links { font-size: 0.85rem; margin: 0.35rem 0; }
    .links a { color: var(--accent); }
    .meta-table { width: 100%; font-size: 0.8rem; border-collapse: collapse; margin-top: 0.5rem; }
    .meta-table th { text-align: left; width: 11rem; vertical-align: top; color: #555; font-weight: 600; }
    .meta-table td, .meta-table th { border-top: 1px solid #eee; padding: 0.25rem 0.35rem; }
    .hint { font-size: 0.8rem; color: #666; margin-top: 0.25rem; }
    .local-docs { margin: 0.5rem 0; font-size: 0.85rem; }
    .doc-link-row { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin: 0.15rem 0; }
    .btn-view-doc {
      font-size: 0.75rem; padding: 0.12rem 0.45rem; border-radius: 4px;
      border: 1px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer;
    }
    .btn-view-doc:hover { background: #e8f4fc; }
  </style>
</head>
<body>
  <header>
    <h1>Search eIDAS references</h1>
    <p class="nav">
      <a href="index.html">← Report index</a>
      · <a href="index.html#graph">Interactive graph</a>
      · Full-text search (includes summary &amp; scope keywords)
    </p>
  </header>

  <form id="search-form" role="search">
    <label for="q">Full text</label>
    <input type="search" id="q" name="q" placeholder="e.g. ETSI EN 319 401 qualified certificate" autocomplete="off"/>

    <div class="row">
      <div>
        <label for="body">Standardization body <span class="hint">(specifications only)</span></label>
        <select id="body" name="body">
          <option value="">All standardization bodies</option>
        </select>
        <div id="sdo-chips" aria-label="Quick filter by standardization body"></div>
      </div>
      <div>
        <label for="kind">Document type</label>
        <select id="kind" name="kind">
          <option value="">All types</option>
          <option value="legal">EU legal act (markdown)</option>
          <option value="specification">Specification (metadata)</option>
          <option value="specification_document">Specification (document text)</option>
        </select>
      </div>
    </div>

    <label for="tags">Tags <span class="hint">(comma-separated; all must match)</span></label>
    <input type="text" id="tags" name="tags" placeholder="e.g. etsi-en, cited-by-eu-law"/>
    <div id="facet-tags" aria-label="Suggested tags"></div>

    <div class="actions">
      <button type="submit">Search</button>
      <button type="button" id="clear">Clear</button>
    </div>
  </form>

  <p id="status">Loading…</p>
  <p class="hint">Open via <code>file://</code> or a local server; the index loads from <code>search-index.js</code>.</p>
  <div id="results" aria-live="polite"></div>

  <script src="search-index.js"></script>
  <script src="eidas-search-core.js"></script>
  <script src="document-links.js"></script>
  <script src="search.js"></script>
</body>
</html>
