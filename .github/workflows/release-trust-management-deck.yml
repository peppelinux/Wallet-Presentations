# Release → PDF + HTML zip on the release; HTML site → gh-pages branch.
#
# Requirements:
# - This file must be on your DEFAULT branch (e.g. master) on GitHub — push it before releases run.
# - Settings → Pages → Source: Deploy from a branch → gh-pages → / (root)

name: Trust management deck — release assets & GitHub Pages

on:
  release:
    types: [published]
  push:
    branches: [main, master]
    paths:
      - "trust-management-eudi-wallet/**"
      - ".github/workflows/release-trust-management-deck.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trust-management-deck-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Marp PDF uses headless Chromium; Ubuntu runners sometimes missing libs
      - name: Install Chromium dependencies (Marp PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1
          sudo apt-get install -y --no-install-recommends libasound2t64 2>/dev/null || \
            sudo apt-get install -y --no-install-recommends libasound2

      - name: Build deck (diagrams, HTML, PDF)
        working-directory: trust-management-eudi-wallet
        run: make all

      - name: Prepare static site (index.html + assets)
        working-directory: trust-management-eudi-wallet
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/site/diagrams" "$GITHUB_WORKSPACE/site/images"
          cp deck.html "$GITHUB_WORKSPACE/site/index.html"
          cp workshop-barcelona.css "$GITHUB_WORKSPACE/site/"
          cp diagrams/*.svg "$GITHUB_WORKSPACE/site/diagrams/"
          shopt -s nullglob
          for f in images/*; do
            [[ "$(basename "$f")" == .gitkeep ]] && continue
            cp -r "$f" "$GITHUB_WORKSPACE/site/images/"
          done
          ls -la "$GITHUB_WORKSPACE/site" "$GITHUB_WORKSPACE/site/diagrams" "$GITHUB_WORKSPACE/site/images" | head -80

      - name: Attach PDF and HTML zip to release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test -f trust-management-eudi-wallet/deck.pdf
          cp trust-management-eudi-wallet/deck.pdf "$GITHUB_WORKSPACE/trust-management-eudi-wallet-${TAG}.pdf"
          (cd "$GITHUB_WORKSPACE/site" && zip -r "$GITHUB_WORKSPACE/trust-management-eudi-wallet-${TAG}-html.zip" .)
          ls -la "$GITHUB_WORKSPACE"/trust-management-eudi-wallet-*.*

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            trust-management-eudi-wallet-${{ github.event.release.tag_name }}.pdf
            trust-management-eudi-wallet-${{ github.event.release.tag_name }}-html.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
