# Build every presentation folder that contains deck.md, deploy listing + decks to gh-pages.
#
# Configure GitHub Pages: Deploy from branch → gh-pages → / (root)

name: Wallet presentations — GitHub Pages

on:
  release:
    types: [published]
  push:
    branches: [main, master]
    paths:
      - "**/deck.md"
      - "**/Makefile"
      - "**/workshop-barcelona.css"
      - "**/.marprc.yml"
      - "**/diagrams/**"
      - "**/images/**"
      - "scripts/**"
      - ".github/workflows/release-trust-management-deck.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet-presentations-gh-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chromium dependencies (Marp PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1
          sudo apt-get install -y --no-install-recommends libasound2t64 2>/dev/null || \
            sudo apt-get install -y --no-install-recommends libasound2

      - name: Build all decks and static site
        env:
          # Optional repo variable: custom GitHub Pages root (no trailing slash). Default in script: peppelinux.github.io/Wallet-Presentations
          GITHUB_PAGES_BASE: ${{ vars.WALLET_PRESENTATIONS_PAGES_URL }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/build-gh-pages-site.sh
          ./scripts/build-gh-pages-site.sh
          ls -la site site/*/ 2>/dev/null | head -120

      - name: Attach PDF and HTML zip per presentation (release only)
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' pdf; do
            base="$(basename "$(dirname "$pdf")")"
            cp "$pdf" "${GITHUB_WORKSPACE}/${base}-${TAG}.pdf"
          done < <(find . -mindepth 2 -maxdepth 2 -type f -name deck.pdf -print0)
          (cd site && zip -r "${GITHUB_WORKSPACE}/wallet-presentations-${TAG}-html-full-site.zip" .)
          ls -la "${GITHUB_WORKSPACE}"/*.pdf "${GITHUB_WORKSPACE}"/*-html-full-site.zip 2>/dev/null || true

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            *-${{ github.event.release.tag_name }}.pdf
            wallet-presentations-${{ github.event.release.tag_name }}-html-full-site.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
